[build]
# El build genera el CV en PDF y las imágenes OG con Chromium
command = "npx playwright install --only-shell chromium && npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "22.23.4"
# Chromium dentro de node_modules, que Netlify cachea entre builds
PLAYWRIGHT_BROWSERS_PATH = "0"

# El CV lleva el email en texto plano: se puede descargar, pero no se indexa
[[headers]]
for = "/cv/*"
[headers.values]
X-Robots-Tag = "noindex"

# Redirects: las URLs públicas son contrato. Inventario y motivos en MIGRATION.md.
# Solo /aniversario lleva force: sin force, un archivo estático siempre gana,
# /portfolio/:slug no coincide con /portfolio, así que no hay bucle.

[[redirects]]
from = "/aniversario"
to = "https://gifrases.ilanvivanco.com/"
status = 301
force = true

# Paths por defecto de Nuxt y páginas viejas
[[redirects]]
from = "/about"
to = "/sobre-mi"
status = 301

[[redirects]]
from = "/resume"
to = "/curriculum"
status = 301

[[redirects]]
from = "/contact"
to = "/contacto"
status = 301

[[redirects]]
from = "/contact-me"
to = "/contacto"
status = 301

[[redirects]]
from = "/portfolio/:slug"
to = "/portfolio"
status = 301

# Blog: Fase 2
[[redirects]]
from = "/blog"
to = "/"
status = 301

[[redirects]]
from = "/blog/*"
to = "/"
status = 301

# Inglés: Fase 2
[[redirects]]
from = "/en/about"
to = "/sobre-mi"
status = 301

[[redirects]]
from = "/en/resume"
to = "/curriculum"
status = 301

[[redirects]]
from = "/en/contact"
to = "/contacto"
status = 301

[[redirects]]
from = "/en/portfolio"
to = "/portfolio"
status = 301

[[redirects]]
from = "/en/portfolio/*"
to = "/portfolio"
status = 301

[[redirects]]
from = "/en/blog/*"
to = "/"
status = 301

[[redirects]]
from = "/en"
to = "/"
status = 301

[[redirects]]
from = "/en/*"
to = "/"
status = 301

# Imágenes viejas que pueden seguir en cachés de redes o en buscadores
[[redirects]]
from = "/images/ilan-vivanco-social-card.png"
to = "/og.png"
status = 301

[[redirects]]
from = "/images/ilan-vivanco.jpg"
to = "/img/ilan-800.webp"
status = 301

[[redirects]]
from = "/images/ilan-vivanco-square.jpg"
to = "/img/ilan-sq-480.webp"
status = 301

[[redirects]]
from = "/images/ilan-vivanco-logo.png"
to = "/favicon.svg"
status = 301

[[redirects]]
from = "/images/favicon.png"
to = "/favicon.svg"
status = 301
